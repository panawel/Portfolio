<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow1" cx="15%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#060608"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Outer border -->
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Left accent bar -->
  <rect x="80" y="170" width="4" height="290" rx="2" fill="url(#accentLine)"/>

  <!-- QA badge pill -->
  <rect x="112" y="170" width="148" height="36" rx="18" fill="rgba(0,243,255,0.1)" stroke="rgba(0,243,255,0.35)" stroke-width="1"/>
  <text x="186" y="193" font-family="'Courier New', monospace" font-size="14" font-weight="600" fill="#00f3ff" text-anchor="middle" letter-spacing="1">QA Engineer</text>

  <!-- Main name -->
  <text x="112" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="700" fill="#ffffff" letter-spacing="-2">Idan Pnuel</text>

  <!-- Tagline -->
  <text x="112" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#9ca3af" letter-spacing="0.3">Automation · Mobile Testing · AI-Powered QA Workflows</text>

  <!-- Accent divider line -->
  <rect x="112" y="375" width="320" height="2" rx="1" fill="url(#accentLine)"/>

  <!-- Stats row -->
  <text x="112" y="425" font-family="'Courier New', monospace" font-size="20" font-weight="700" fill="#00f3ff">8+</text>
  <text x="148" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#9ca3af">Years Experience</text>

  <text x="330" y="425" font-family="'Courier New', monospace" font-size="20" font-weight="700" fill="#00ff88">7</text>
  <text x="352" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#9ca3af">Projects</text>

  <!-- Bottom URL -->
  <text x="112" y="500" font-family="'Courier New', monospace" font-size="15" fill="rgba(255,255,255,0.25)" letter-spacing="0.5">panawel.github.io/Portfolio</text>

  <!-- Decorative right-side checkmark -->
  <circle cx="980" cy="315" r="110" fill="rgba(0,243,255,0.04)" stroke="rgba(0,243,255,0.1)" stroke-width="1"/>
  <path d="M930 315 L965 350 L1030 280" stroke="url(#accentLine)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
